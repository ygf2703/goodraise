name: Validate GoodRaise

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and typecheck React application
        run: npm run build
      - name: Test Node backend and shared campaign logic
        run: npm test
      - name: Verify authentication
        run: npm run verify:auth
      - name: Verify PostgreSQL migrations and ingestion
        run: npm run test:postgres
      - name: Verify repository hygiene
        run: npm run verify:hygiene
