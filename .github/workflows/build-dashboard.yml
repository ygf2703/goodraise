name: Build Dashboard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Build dashboard
        run: python work/build_yellow_dashboard.py

      - name: Verify outputs
        run: |
          test -f outputs/yellow-project-dashboard-browser.html
          test -f outputs/yellow-project-dashboard.html
