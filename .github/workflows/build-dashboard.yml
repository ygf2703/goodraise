name: Build Dashboard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build dashboard
        run: python work/build_yellow_dashboard.py

      - name: Verify outputs
        run: python scripts/verify_dashboard_release.py

      - name: Verify auth flow
        run: npm run verify:auth

      - name: Test intelligence layer
        run: npm run test:intelligence

      - name: Verify repository hygiene
        run: python scripts/verify_repository_hygiene.py
