name: goodraise

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${GOODRAISE_LOCAL_DB_NAME:-goodraise}
      POSTGRES_USER: ${GOODRAISE_LOCAL_DB_USER:-goodraise}
      POSTGRES_PASSWORD: ${GOODRAISE_LOCAL_DB_PASSWORD:-goodraise-local-only}
    ports:
      - "127.0.0.1:${GOODRAISE_LOCAL_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - goodraise_postgres_data:/var/lib/postgresql
      - ./work/database-backups:/backups:ro

volumes:
  goodraise_postgres_data:
