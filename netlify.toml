[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/data/**"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/public-context"
  to = "/.netlify/functions/public-context"
  status = 200
  force = true

# The auth function declares its API paths in netlify/functions/auth.ts.
# Custom paths disable its default /.netlify/functions/auth URL, so API
# requests must reach those paths directly instead of being rewritten there.

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/rules"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200
  force = true

# Keep the marketing landing page public instead of treating "goodraise" as a
# campaign slug and routing it into the application SPA.
[[redirects]]
  from = "/goodraise"
  to = "/goodraise/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/:project"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/:project/:ambassador"
  to = "/index.html"
  status = 200
